:root{--bg:#eef3fb;--card:#fff;--ink:#0f1a3a;--mut:#6b7690;--line:#e3e8f2;--nav:#0c1233;--pri:#2563eb;--pur:#6b2c91;--gold:#f5b301;--ok:#16a34a;--wa:#f97316;--in:#2563eb;--ic:#fff4d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f22;--card:#141b34;--ink:#e8ecf8;--mut:#98a3c0;--line:#243055;--ic:#33290f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f22;--card:#141b34;--ink:#e8ecf8;--mut:#98a3c0;--line:#243055;--ic:#33290f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Sarabun,"Noto Sans Thai",Tahoma,sans-serif;display:flex;min-height:100vh}
aside{width:236px;background:var(--nav);color:#c8d0ee;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;padding:0 8px 18px;line-height:1.2}
.logo img{width:42px;height:42px;border-radius:50%}.hl{display:none}
.logo small{display:block;font-weight:400;color:#8f9bc7;font-size:12px}
aside a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;color:inherit;text-decoration:none;border-left:3px solid transparent}
aside a:hover{background:#171f4a}
aside a.on{background:#1a2358;color:#fff;border-left-color:var(--pri)}
main{flex:1;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:9px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.on{background:var(--gold);border-color:var(--gold);color:#241a00;font-weight:600}
.pg{padding:22px 28px;display:grid;gap:18px;max-width:1200px}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,26,58,.07)}
.card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .btn{margin-left:auto;font-size:13px;padding:4px 10px;display:none}
.edit .card h2 .btn{display:inline-block}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.kpi{display:flex;gap:12px;align-items:center}
.kpi b{font-size:26px;display:block;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--ic)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lk{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit;display:block}
.lk:hover{border-color:var(--pri)}
.lk b{display:block}.lk small{color:var(--mut)}
.lk.no{opacity:.55}
.x{position:absolute;top:6px;right:8px;border:0;background:none;color:#dc2626;cursor:pointer;font-size:16px;display:none}
.edit .x{display:block}
.news{display:grid;gap:10px}
.nw{border-left:4px solid var(--pur);padding:4px 12px;position:relative}
.nw time{color:var(--mut);font-size:12.5px}.nw b{display:block}.nw p{margin:2px 0 0;color:var(--mut)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line)}
.st{border:0;background:none;font:inherit;font-weight:600;cursor:pointer;padding:0;display:inline-flex;gap:6px;align-items:center}
.st:before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid currentColor}
.s0{color:var(--wa)}.s1{color:var(--in)}.s2{color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar i{background:var(--ok)}.bar u{background:var(--in)}
.pr{display:grid;gap:5px;margin-bottom:14px}.pr div{display:flex;justify-content:space-between;font-size:14px}
.don{width:150px;height:150px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center}
.don div{width:94px;height:94px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.2}
.lg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--mut)}
.org{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:14px}.org b{color:var(--ink)}
.empty{color:var(--mut);padding:6px 0}
dialog{border:0;border-radius:14px;padding:20px;width:min(440px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,10,30,.55)}
dialog label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mut)}
dialog input,dialog textarea,dialog select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:16px 0 0}
.pp{position:relative;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:64px}
.edit .pp{cursor:pointer}
.pp b{display:block;line-height:1.25}.pp small{color:var(--mut);display:block}
.av{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;background:var(--bg);display:grid;place-items:center;border:2px solid var(--gold)}
.av img{width:100%;height:100%;object-fit:cover}
.pp.head,.pp.big{background:linear-gradient(135deg,#4a1670,var(--pur));color:#fff;border:0}
.pp.head small,.pp.big small{color:#e6d6f2}
.pp.big{max-width:420px;margin:0 auto 14px;padding:14px 18px}.pp.big .av{width:64px;height:64px}
.pp.vac{background:transparent;color:var(--ink);border:2px dashed var(--line)}.pp.vac small{color:var(--mut)}
.g2o{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ocols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
.oc{display:grid;gap:10px}
.pill{justify-self:center;padding:5px 18px;border:1px solid var(--line);border-radius:20px;font-weight:600;background:var(--card);text-align:center}
.oadd{display:none}.edit .oadd{display:block}
.sl{display:none}
.btn{min-height:40px}
body{-webkit-tap-highlight-color:transparent}
dialog input,dialog textarea{font-size:16px}
@media (max-width:1100px){
aside{width:88px;padding:16px 8px}
.logo{justify-content:center;padding:0 0 14px}.logo div{display:none}
aside a{flex-direction:column;gap:2px;text-align:center;padding:10px 4px;font-size:12px;line-height:1.2}
.fl{display:none}.sl{display:block}
.g2{grid-template-columns:1fr}header,.pg{padding-left:20px;padding-right:20px}
}
@media (max-width:820px){
:root{padding-bottom:0}
body{flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
aside{position:fixed;inset:auto 0 0 0;width:100%;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;z-index:9;border-top:1px solid #1d2766}
aside a{flex:1;border-left:0;border-radius:12px;padding:8px 2px;min-height:54px;justify-content:center;font-size:11px}
aside a span:first-child{font-size:20px}
aside a.on{background:#1f2a66}
.logo{display:none}
.hl{display:inline-block;width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:8px}
header{top:env(safe-area-inset-top,0px);padding:10px 14px;gap:8px}header h1{font-size:17px}
.btn{min-height:44px}
.pg{padding:14px 14px 96px;gap:14px}
.g4{grid-template-columns:repeat(2,1fr)}
.links{grid-template-columns:1fr}
.lk{min-height:56px;padding:14px}
.x{width:36px;height:36px;font-size:18px}
.card h2 .btn{padding:6px 12px}
.tw{overflow:visible}
table,tbody,tr,td{display:block;width:100%;min-width:0}
tr:has(th){display:none}
tr{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
td{border:0;padding:3px 0}
td:first-child{font-weight:600}
td:nth-child(2){color:var(--mut);font-size:13px}
.st{min-height:40px;font-size:15px}
dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}

function pdf(jpg,w,h){const E=new TextEncoder(),P=[],o=[];let n=0;
 const add=b=>{if(typeof b==="string")b=E.encode(b);P.push(b);n+=b.length};
 const ob=(i,s,b)=>{o[i]=n;add(`${i} 0 obj\n${s}`);if(b){add("\nstream\n");add(b);add("\nendstream")}add("\nendobj\n")};
 const pw=842,ph=595,m=20,k=Math.min((pw-2*m)/w,(ph-2*m)/h),dw=w*k,dh=h*k,cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${((pw-dw)/2).toFixed(2)} ${((ph-dh)/2).toFixed(2)} cm /Im0 Do Q`;
 add("%PDF-1.4\n");ob(1,"<< /Type /Catalog /Pages 2 0 R >>");ob(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
 ob(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>`);
 ob(4,`<< /Length ${cs.length} >>`,E.encode(cs));
 ob(5,`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>`,jpg);
 const xr=n;add("xref\n0 6\n0000000000 65535 f \n");for(let i=1;i<6;i++)add(String(o[i]).padStart(10,"0")+" 00000 n \n");
 add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);return new Blob(P,{type:"application/pdf"})}

  const fn="org-chart-pea-banphaeng."+t;
